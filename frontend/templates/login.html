<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartReco AI Login</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(120deg, #0f2027, #203a43, #2c5364);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Animated Background Glow */
        body::before {
            content: "";
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, #00ffff, transparent);
            filter: blur(80px);
            animation: move 8s infinite alternate;
            z-index: 0;
        }

        @keyframes move {
            from {
                transform: translate(-100px, -50px);
            }
            to {
                transform: translate(200px, 200px);
            }
        }

        /* Glassmorphism Login Card */
        .login-card {
            width: 420px;
            padding: 40px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 1;
        }

        /* AI Animated Logo */
        .ai-logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            background: linear-gradient(45deg, #00ffff, #008cff);
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            50% {
                transform: scale(1.15);
            }
        }

        /* Input Styles & Focus States */
        .form-control {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white !important;
            transition: all 0.3s;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            color: white !important;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        /* Custom AI Button */
        .btn-ai {
            background: linear-gradient(45deg, #00ffff, #008cff);
            border: none;
            color: #000;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-ai:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 255, 255, 0.4);
            color: #000;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="ai-logo mb-4">🤖</div>

        <h2 class="text-center">SmartReco AI</h2>
        <p class="text-center text-white-50 mb-4">Login to your personalized AI feed</p>

        <!-- Message Container -->
        <div id="message">
            {% if error %}
            <div class="alert alert-danger p-2 text-center mb-3">
                {{ error }}
            </div>
            {% endif %}
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label text-white-50 small">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    class="form-control form-control-lg" 
                    placeholder="Enter email" 
                    required
                >
            </div>

            <div class="mb-4">
                <label for="password" class="form-label text-white-50 small">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-control form-control-lg" 
                    placeholder="Enter password" 
                    required
                >
            </div>

            <button class="btn btn-ai w-100 btn-lg rounded-pill" type="submit" id="loginBtn">
                Login
            </button>
        </form>

        <p class="text-center mt-4 mb-0">
            Don't have an account? 
            <a href="/auth/register" class="text-info text-decoration-none fw-bold">Register</a>
        </p>
    </div>

    <script>
        const form = document.getElementById("loginForm");
        const messageDiv = document.getElementById("message");
        const loginBtn = document.getElementById("loginBtn");

        form.addEventListener("submit", async function(e) {
            e.preventDefault();

            // UI Loading state
            loginBtn.disabled = true;
            loginBtn.innerHTML = "Logging in...";
            messageDiv.innerHTML = "";

            // Send standard FormData matching FastAPI Form(...) expectations
            const formData = new FormData(form);

            try {
                const response = await fetch("/auth/login", {
                    method: "POST",
                    body: formData
                });

                if (response.redirected) {
                    // Browser redirect triggered by FastAPI
                    window.location.href = response.url;
                    return;
                }

                if (response.ok) {
                    messageDiv.innerHTML = `
                        <div class="alert alert-success p-2 text-center mb-3">
                            Login Successful! Redirecting...
                        </div>
                    `;
                    setTimeout(() => {
                        window.location.href = "/dashboard";
                    }, 800);
                } else {
                    // Handle non-200 responses cleanly
                    let errorMsg = "Invalid email or password.";
                    try {
                        const data = await response.json();
                        if (typeof data.detail === "string") {
                            errorMsg = data.detail;
                        } else if (Array.isArray(data.detail)) {
                            errorMsg = data.detail.map(err => err.msg).join(", ");
                        }
                    } catch (pErr) {
                        // Response was HTML page with Jinja error
                    }

                    messageDiv.innerHTML = `
                        <div class="alert alert-danger p-2 text-center mb-3">
                            ${errorMsg}
                        </div>
                    `;
                }
            } catch (error) {
                console.error("Login Error:", error);
                messageDiv.innerHTML = `
                    <div class="alert alert-danger p-2 text-center mb-3">
                        Server connection error. Please try again.
                    </div>
                `;
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = "Login";
            }
        });
    </script>

</body>

</html>
